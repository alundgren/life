services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /app/data/life.db
      OLLAMA_HOST: http://ollama:11434
      # Keep the dev-only clock disabled even when .env contains a local development setting.
      SIMULATED_CLOCK: "false"
    volumes:
      - sqlite-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: ./docker/ollama
    restart: unless-stopped
    # Sized for an 8GB Raspberry Pi 5, leaving headroom for the app and OS.
    # Lower this (e.g. 2g) on a 4GB Pi 5, or raise it on a 16GB one.
    mem_limit: 4g
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/model-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30m

volumes:
  sqlite-data:
  ollama-data:
